# Publica na VPS da Hostinger a cada push na main.
# Enquanto os segredos VPS_HOST e VPS_SSH_KEY não existirem, só avisa e sai
# (a Vercel continua publicando normalmente até a migração).
name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Publicar na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "VPS_HOST/VPS_SSH_KEY não configurados — nada a fazer."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps
          chmod 600 ~/.ssh/vps
          ssh -i ~/.ssh/vps -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 \
            "flux@$VPS_HOST" flux-deploy
