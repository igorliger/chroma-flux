# Nginx — Chroma Flux. O certbot (deploy/ssl.sh) acrescenta o HTTPS aqui.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# chromaflux.com.br -> www.chromaflux.com.br (igual à Vercel)
server {
  listen 80;
  listen [::]:80;
  server_name chromaflux.com.br;
  return 301 https://www.chromaflux.com.br$request_uri;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name www.chromaflux.com.br _;

  client_max_body_size 25m;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }
}
