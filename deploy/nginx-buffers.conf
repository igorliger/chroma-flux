# Nginx — buffers maiores para cabeçalhos (vale para o site e para a API).
# Instalado em /etc/nginx/conf.d/chroma-flux-buffers.conf (contexto http).
#
# O padrão (4 KB) não comporta os cookies de login do Supabase (o token vem
# fatiado em pedaços de ~3,5 KB) nem o Content-Location do PostgREST em
# consultas longas: o Nginx desistia com "upstream sent too big header" e
# mostrava 502 Bad Gateway — no site, para quem estava logado; na API, para
# endereços a partir de ~3 mil caracteres. Corrigido em 08/10/2026.
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;
large_client_header_buffers 4 32k;
